<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AvaScry Dominion — Official Card Rulings &amp; Synergies{% endblock %}</title>
  
  <meta name="theme-color" content="#1a1c23">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Dominion Medieval/Copper Aesthetic Styles -->
  <style>
    :root {
      --bg: #111318;
      --card-bg: #181b22;
      --border: #2e3440;
      --text: #e2e8f0;
      --muted: #8892b0;
      --accent: #e5a93c;       /* Dominion Gold/Copper */
      --accent-hover: #f3c267;
      --rule-bg: #1c202a;
      --rule-border: #b48637;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      line-height: 1.6;
      padding-bottom: 4rem;
    }
    header.site-header {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 1.5rem;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.05em;
    }
    .logo-badge {
      background: linear-gradient(135deg, #e5a93c, #b48637);
      color: #000;
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 1.25rem;
      transition: color 0.15s ease;
    }
    nav a:hover { color: var(--accent); }
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    footer {
      max-width: 1100px;
      margin: 4rem auto 0 auto;
      padding: 2rem 1.5rem 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/dominion" class="logo">
        AvaScry <span class="logo-badge">Dominion</span>
      </a>
      <nav aria-label="Dominion Navigation">
        <a href="/dominion">Rulings &amp; Cards</a>
        <a href="/dominion/llms.txt">llms.txt</a>
        <a href="https://avascry.com">MTG Network</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Part of the <strong>AvaScry Card Network</strong>. Official Donald X. Vaccarino rulings, errata, and card synergy.</p>
    <p><a href="/dominion/llms.txt">llms.txt</a> &bull; <a href="/dominion/sitemap.xml">Sitemap</a></p>
  </footer>
</body>
</html>
