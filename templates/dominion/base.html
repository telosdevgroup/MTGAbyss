<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AvaScry Dominion — Official Card Rulings &amp; Synergies{% endblock %}</title>
  
  <meta name="theme-color" content="#1a1c23">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Dominion Theme: Warm Light Body with Dark Header & Footer -->
  <style>
    :root {
      --bg: #f8fafc;            /* Crisp clean light background */
      --card-bg: #ffffff;       /* Pure white card panel */
      --border: #e2e8f0;        /* Light border */
      --border-subtle: #cbd5e1;
      --text: #0f172a;          /* Deep dark readable text */
      --muted: #475569;         /* Slate muted text */
      --accent: #b45309;        /* Warm Dominion amber/copper */
      --accent-hover: #92400e;
      --rule-bg: #fffbeb;       /* Warm parchment highlight for rules */
      --rule-border: #f59e0b;
      --header-bg: #0f172a;     /* Deep dark slate header & footer */
      --header-border: #1e293b;
      --header-text: #f8fafc;
      --header-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header.site-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.95rem 1.5rem;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.05em;
    }
    .logo-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    nav a {
      color: var(--header-muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 1.25rem;
      transition: color 0.15s ease;
    }
    nav a:hover { color: #fff; }
    main {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #f1f5f9;
      color: var(--text);
    }
    footer {
      background: var(--header-bg);
      border-top: 1px solid var(--header-border);
      color: var(--header-muted);
      font-size: 0.85rem;
      padding: 2.5rem 1.5rem;
      margin-top: auto;
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    footer strong { color: #fff; }
    footer a { color: #38bdf8; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/dominion" class="logo">
        AvaScry <span class="logo-badge">Dominion</span>
      </a>
      <nav aria-label="Dominion Navigation">
        <a href="/dominion">Rulings &amp; Cards</a>
        <a href="/dominion/llms.txt">llms.txt</a>
        <a href="https://avascry.com">MTG Network</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="footer-inner">
      <p>Part of the <strong>AvaScry Card Network</strong>. Official Donald X. Vaccarino rulings, errata, and card synergy.</p>
      <p><a href="/dominion/llms.txt">llms.txt</a> &bull; <a href="/dominion/sitemap.xml">Sitemap</a></p>
    </div>
  </footer>
</body>
</html>
