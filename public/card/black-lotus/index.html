  <div class="page-wrapper">

        </div>

        <div class="theater-controls">
          <button class="theater-btn" id="theater-toggle-btn">
            <span class="icon">&nbsp;&nbsp;&#9654;</span> <span>Theater Mode</span>

          <button class="theater-btn" id="order-toggle-btn">
            <span class="icon">&#8987;</span> <span id="order-label">Date Order</span>

          -->

      <!-- All Printings Carousel Section -->
      <section class="carousel-section">
        <h2 class="carousel-title">All Printings</h2>
        <div class="carousel-container" id="carousel-container">
          <!-- Populated by JavaScript -->
        </div>
      </section>

      <script>
        // Inject printings data
        const initialPrintings = [{"set_name": "Limited Edition Alpha", "set_code": "LEA", "image": "https://cards.scryfall.io/large/front/b/0/b0faa7f2-b547-42c4-a810-839da50dadfe.jpg?1782722911", "released_at": "1993-08-05", "artist": "Christopher Rush", "collector_number": "232"}, {"set_name": "Limited Edition Beta", "set_code": "LEB", "image": "https://cards.scryfall.io/large/front/b/3/b3a69a1c-c80f-4413-a6fd-ae54cabbce28.jpg?1782722773", "released_at": "1993-10-04", "artist": "Christopher Rush", "collector_number": "233"}, {"set_name": "Unlimited Edition", "set_code": "2ED", "image": "https://cards.scryfall.io/large/front/4/a/4a2e428c-dd25-484c-bbc8-2d6ce10ef42c.jpg?1782722640", "released_at": "1993-12-01", "artist": "Christopher Rush", "collector_number": "233"}, {"set_name": "Intl. Collectors' Edition", "set_code": "CEI", "image": "https://cards.scryfall.io/large/front/b/a/bad6b494-d773-4f7d-ac39-85d82e1d3015.jpg?1782755982", "released_at": "1993-12-10", "artist": "Christopher Rush", "collector_number": "233"}, {"set_name": "Collectors' Edition", "set_code": "CED", "image": "https://cards.scryfall.io/large/front/0/9/0948e6dc-8af7-45d3-91de-a2aebee83e82.jpg?1782756162", "released_at": "1993-12-10", "artist": "Christopher Rush", "collector_number": "233"}, {"set_name": "Oversized 90's Promos", "set_code": "O90P", "image": "https://cards.scryfall.io/large/front/a/5/a56075c1-019b-4cff-be0b-10037e8f2afb.jpg?1782755724", "released_at": "1996-07-01", "artist": "Christopher Rush", "collector_number": "2"}, {"set_name": "Vintage Championship", "set_code": "OVNT", "image": "https://cards.scryfall.io/large/front/9/c/9c4e9dea-6782-4c8b-a5a1-c72fc2c81dab.jpg?1782754303", "released_at": "2003-07-24", "artist": "Christopher Rush", "collector_number": "2003"}, {"set_name": "Vintage Masters", "set_code": "VMA", "image": "https://cards.scryfall.io/large/front/b/d/bd8fa327-dd41-4737-8f19-2cf5eb1f7cdd.jpg?1782751474", "released_at": "2014-06-16", "artist": "Chris Rahn", "collector_number": "4"}, {"set_name": "Magic Online Promos", "set_code": "PRM", "image": "https://cards.scryfall.io/large/front/b/9/b9203f23-8c7a-47e1-b359-5a326722d1c0.jpg?1782751053", "released_at": "2014-10-17", "artist": "Chris Rahn", "collector_number": "46932"}, {"set_name": "Vintage Championship", "set_code": "OVNT", "image": "https://cards.scryfall.io/large/front/1/1/11e5a2c6-dcc4-4ad3-a4b5-b9095d77c4f8.jpg?1782748519", "released_at": "2017-10-19", "artist": "Steven Belledin", "collector_number": "2017NA"}, {"set_name": "Alchemy: Dominaria", "set_code": "YDMU", "image": "https://cards.scryfall.io/large/front/a/1/a192fff8-ea06-4681-a99d-63ae21a88bd1.jpg?1782737102", "released_at": "2022-10-05", "artist": "Chris Rahn", "collector_number": "35"}, {"set_name": "30th Anniversary Edition", "set_code": "30A", "image": "https://cards.scryfall.io/large/front/3/a/3a10650e-58f7-4a99-a77d-3f42d61ecf93.jpg?1782735830", "released_at": "2022-11-28", "artist": "Christopher Rush", "collector_number": "228"}, {"set_name": "30th Anniversary Edition", "set_code": "30A", "image": "https://cards.scryfall.io/large/front/9/8/983c1308-d81b-444f-9806-a9723b987af1.jpg?1782735602", "released_at": "2022-11-28", "artist": "Christopher Rush", "collector_number": "525"}, {"set_name": "Vintage Championship", "set_code": "OVNT", "image": "https://cards.scryfall.io/large/front/c/f/cffb4aad-30e8-4c27-ad12-048630caed8e.jpg?1782731693", "released_at": "2023-11-17", "artist": "Raoul Vitale", "collector_number": "2023EU"}, {"set_name": "Vintage Championship", "set_code": "OVNT", "image": "https://cards.scryfall.io/large/front/0/a/0a570bca-ff73-4899-8069-3557fedfb717.jpg?1782731336", "released_at": "2023-11-24", "artist": "Jarel Threat", "collector_number": "2023A"}, {"set_name": "Vintage Championship", "set_code": "OVNT", "image": "https://cards.scryfall.io/large/front/f/5/f5d24a5b-c950-4fd9-99e6-a4b979d915b3.jpg?1782731233", "released_at": "2023-12-08", "artist": "Scott M. Fischer", "collector_number": "2023NA"}];
        let printings = [...initialPrintings]; // working copy
        let currentIndex = 0;
        let autoplayTimer = null;
        let isAutoplayActive = false;
        let isRandom = false;

        const container = document.getElementById('carousel-container');
        const heroImage = document.getElementById('hero-card-image');
        const heroWrapper = document.getElementById('hero-card-wrapper');
        const subtitle = document.getElementById('hero-card-subtitle');
        const theaterBtn = document.getElementById('theater-toggle-btn');
        // const orderBtn = document.getElementById('order-toggle-btn');
        // const orderLabel = document.getElementById('order-label');

        function updateCarousel(isClick = false) {
          if (printings.length === 0) return;

          const activePrint = printings[currentIndex];

          // Trigger transition effect on hero image and subtitle if changing via click/autoplay
          if (isClick) {
            heroWrapper.classList.add('fade');
            subtitle.classList.add('fade');
          }

          setTimeout(() => {
            heroImage.src = activePrint.image;
            
            // Build creative metadata subtitle
            subtitle.innerHTML = `
              <span>Set: <span class="highlight">${activePrint.set_name}</span> (<span class="highlight">${activePrint.set_code}</span>)</span>
              <span class="divider">/</span>
              <span>Collector #: <span class="highlight">${activePrint.collector_number}</span></span>
              <span class="divider">/</span>
              <span>Released: <span class="highlight">${activePrint.released_at}</span></span>
              <span class="divider">/</span>
              <span>Artist: <span class="highlight">${activePrint.artist}</span></span>
            `;

            if (isClick) {
              heroWrapper.classList.remove('fade');
              subtitle.classList.remove('fade');
            }
          }, isClick ? 150 : 0);

          container.innerHTML = '';

          // Helper to get relative item indices
          const getIndex = (offset) => {
            return (currentIndex + offset + printings.length) % printings.length;
          };

          // If only 1 printing exists
          if (printings.length === 1) {
            const item = document.createElement('div');
            item.className = 'carousel-item center';
            item.innerHTML = `<img src="${printings[0].image}" alt="${printings[0].set_name}">`;
            container.appendChild(item);
            return;
          }

          const indices = [getIndex(-1), currentIndex, getIndex(1)];

          indices.forEach((idx, i) => {
            const item = document.createElement('div');
            if (i === 1) {
              item.className = 'carousel-item center';
            } else {
              item.className = 'carousel-item side-peek';
            }
            item.innerHTML = `<img src="${printings[idx].image}" alt="${printings[idx].set_name}" style="cursor: pointer;">`;
            item.addEventListener('click', () => {
              if (currentIndex !== idx) {
                currentIndex = idx;
                resetAutoplay();
                updateCarousel(true);
              }
            });
            container.appendChild(item);
          });
        }

        // Theater autoplay mode setup
        function startAutoplay() {
          autoplayTimer = setInterval(() => {
            currentIndex = (currentIndex + 1) % printings.length;
            updateCarousel(true);
          }, 4000); // cycle every 4 seconds
        }

        function stopAutoplay() {
          if (autoplayTimer) {
            clearInterval(autoplayTimer);
            autoplayTimer = null;
          }
        }

        function resetAutoplay() {
          if (isAutoplayActive) {
            stopAutoplay();
            startAutoplay();
          }
        }

        function deactivateTheater() {
          isAutoplayActive = false;
          document.body.classList.remove('theater-mode');
          theaterBtn.classList.remove('active');
          theaterBtn.querySelector('.icon').innerHTML = '&nbsp;&nbsp;&#9654;'; // play symbol
          stopAutoplay();
        }

        theaterBtn.addEventListener('click', (e) => {
          e.stopPropagation(); // prevent immediate click-outside trigger
          isAutoplayActive = !isAutoplayActive;
          if (isAutoplayActive) {
            document.body.classList.add('theater-mode');
            theaterBtn.classList.add('active');
            theaterBtn.querySelector('.icon').innerHTML = '&nbsp;&nbsp;&#10074;&#10074;'; // pause symbol
            startAutoplay();
          } else {
            deactivateTheater();
          }
        });

        /* Commented out sort toggle action handler
        orderBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          isRandom = !isRandom;
          
          const currentPrint = printings[currentIndex];
          
          if (isRandom) {
            orderBtn.classList.add('active');
            orderLabel.textContent = 'Random Order';
            
            for (let i = printings.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [printings[i], printings[j]] = [printings[j], printings[i]];
            }
          } else {
            orderBtn.classList.remove('active');
            orderLabel.textContent = 'Date Order';
            printings = [...initialPrintings];
          }
          
          currentIndex = printings.findIndex(p => p.image === currentPrint.image);
          if (currentIndex === -1) currentIndex = 0;
          
          resetAutoplay();
          updateCarousel(true);
        });
        */

        // Click outside active card image close trigger
        document.addEventListener('click', (e) => {
          if (!isAutoplayActive) return;
          const clickedHero = heroWrapper.contains(e.target);
          const clickedCarousel = container.contains(e.target);
          const clickedToggle = theaterBtn.contains(e.target);
          // const clickedOrder = orderBtn ? orderBtn.contains(e.target) : false;
          if (!clickedHero && !clickedCarousel && !clickedToggle) {
            deactivateTheater();
          }
        });

        // Window scroll close trigger
        window.addEventListener('scroll', () => {
          if (isAutoplayActive) {
            deactivateTheater();
          }
        }, { passive: true });



        // Initialize
        updateCarousel(false);
      </script>

      <style>

        }
      </style>

      <div class="old-page-details-wrapper" style="margin-top: 2rem;">
        <header style="margin-top: 2rem;">
          <div class="header-main">
            <h1>Black Lotus</h1>
          </div>
        </header>

        <!-- Similar Cards Row -->
        <section class="similar-cards-section">
          <h2 style="font-size: 1.25rem; font-weight: 800; margin-top: 0; margin-bottom: 0.5rem; color: var(--abyss-text); text-align: left; border-bottom: 1px solid var(--abyss-border); padding-bottom: 0.5rem; letter-spacing: -0.01em;">Similar Cards</h2>
          <div class="similar-cards-row" id="similar-cards-row">

      </div>
      
      <script>
        (function() {
          const similarCards = [{"name": "Lotus Petal", "slug": "lotus-petal", "image_url": "https://cards.scryfall.io/large/front/f/8/f85ab5f9-508e-45de-8fa1-ce1f16552ffc.jpg?1782750662", "similarity": 0.8548}, {"name": "Radiant Lotus", "slug": "radiant-lotus", "image_url": "https://cards.scryfall.io/large/front/b/e/be6dac83-39c2-40dc-a322-76a3ea4e7aee.jpg?1782687768", "similarity": 0.8477}, {"name": "Blacker Lotus", "slug": "blacker-lotus", "image_url": "https://cards.scryfall.io/large/front/4/c/4c85d097-e87b-41ee-93c6-0e54ec41b174.jpg?1782755241", "similarity": 0.8196}];
          const container = document.getElementById('similar-cards-row');
          if (similarCards && similarCards.length > 0) {
            similarCards.forEach(card => {
              const item = document.createElement('div');
              item.className = 'similar-card-item';
              item.addEventListener('click', () => {
                window.location.href = `../../card/${card.slug}/index.html`;
              });
              
              const imgUrl = card.image_url || '../../assets/placeholder-card.png';
              item.innerHTML = `
                <img class="similar-card-img" src="${imgUrl}" alt="${card.name}">
                <div class="similar-card-name" title="${card.name}">${card.name}</div>
              `;
              container.appendChild(item);
            });
          } else {
            const section = document.querySelector('.similar-cards-section');
            if (section) {
              section.style.display = 'none';
            }
          }
        })();
      </script>
    </div>
  </div>

  <footer class="site-footer">

  </footer>
</body>
