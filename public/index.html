<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTGAbyss — What do you seek?</title>
  <meta name="description" content="MTGAbyss: Natural language card search. Find Magic: The Gathering cards.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-837M1ZGHPE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-837M1ZGHPE');
  </script>
  <!-- Microsoft Clarity -->
  <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xj4uzg0vsb");
  </script>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="index.html">MTGAbyss</a>
    <nav>
      <a href="cards/">Cards</a>
    </nav>
  </header>

  <div class="homepage-wrapper">
    <div class="homepage-panel">
      <div class="homepage-brand">MTGAbyss</div>
      <div class="homepage-subtitle">What do you seek?</div>
      
      <form class="homepage-search-form" id="search-form" action="search.html" method="get">
        <input 
          type="text" 
          name="q" 
          id="search-input" 
          class="homepage-search-input" 
          placeholder="Black Lotus" 
          value="Ancient Imperiosaur"
          required
          autocomplete="off"
        >
        <button type="submit" class="homepage-search-btn">Search</button>
      </form>
      
      <div class="homepage-examples">
        <div class="homepage-examples-label" style="text-align: center; margin-top: 1.5rem;">Try searching for:</div>
        <div class="homepage-examples-list" style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 0.75rem;">
          <button type="button" class="homepage-example-pill" data-query="Cabal Trainee" style="text-align: center;">Cabal Trainee</button>
          <button type="button" class="homepage-example-pill" data-query="Petting Zookeeper" style="text-align: center;">Petting Zookeeper</button>
          <button type="button" class="homepage-example-pill" data-query="Rapacious One" style="text-align: center;">Rapacious One</button>
          <button type="button" class="homepage-example-pill" data-query="Fangren Firstborn" style="text-align: center;">Fangren Firstborn</button>
          <button type="button" class="homepage-example-pill" data-query="Sprouting Renewal" style="text-align: center;">Sprouting Renewal</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchForm = document.getElementById('search-form');
      const searchInput = document.getElementById('search-input');
      const pills = document.querySelectorAll('.homepage-example-pill');

      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          const query = pill.getAttribute('data-query');
          searchInput.value = query;
          searchForm.submit();
        });
      });
    });
  </script>
</body>
</html>
