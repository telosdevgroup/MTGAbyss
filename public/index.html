<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTGAbyss — What do you seek?</title>
  <meta name="description" content="MTGAbyss: Natural language card search. Find Magic: The Gathering cards.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-837M1ZGHPE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-837M1ZGHPE');

  <!-- Microsoft Clarity -->
  <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xj4uzg0vsb");

</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="index.html">MTGAbyss</a>
  </header>

  <div class="homepage-wrapper">
    <div class="homepage-panel" style="max-width: 850px !important; margin: 0 auto;">
      <div class="homepage-brand">MTGAbyss</div>
      <div class="homepage-subtitle">What do you seek?</div>
      <div class="homepage-tagline">A bottomless archive of Magic: The Gathering. Where the cards gaze back.</div>
      
      <form class="homepage-search-form" id="search-form" action="search.html" method="get">
        <input 
          type="text" 
          name="q" 
          id="search-input" 
          class="homepage-search-input" 
          placeholder="Black Lotus" 
          value="Ox"
          required
          autocomplete="off"
        >
        <button type="submit" class="homepage-search-btn">Search</button>
      </form>
      
      <div class="homepage-examples">
        <div class="homepage-examples-label">Try searching for:</div>
        <div class="homepage-examples-list" style="display: flex !important; flex-direction: row !important; justify-content: center !important; align-items: center !important; gap: 1rem !important; flex-wrap: nowrap !important; margin-top: 1rem !important; width: 100% !important;">
          <img class="homepage-example-pill-img" data-query="A-Dueling Coach" src="https://cards.scryfall.io/normal/front/2/7/27b19a46-f4e9-4a08-b118-a62a93901c1e.jpg?1782700714" alt="A-Dueling Coach" title="Click to search A-Dueling Coach" style="width: 150px !important; height: 210px !important; object-fit: contain; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--abyss-border); transition: transform 0.2s;">
          <img class="homepage-example-pill-img" data-query="Chocobo Camp // Chocobo Camp" src="https://cards.scryfall.io/normal/front/4/e/4ebf9196-ac3c-4b74-a5c6-af55f728b9fd.jpg?1782724088" alt="Chocobo Camp // Chocobo Camp" title="Click to search Chocobo Camp // Chocobo Camp" style="width: 150px !important; height: 210px !important; object-fit: contain; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--abyss-border); transition: transform 0.2s;">
          <img class="homepage-example-pill-img" data-query="Night Market" src="https://cards.scryfall.io/normal/front/a/8/a8c1dce3-6136-4294-9d2b-5ef8527d733b.jpg?1782687754" alt="Night Market" title="Click to search Night Market" style="width: 150px !important; height: 210px !important; object-fit: contain; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--abyss-border); transition: transform 0.2s;">
          <img class="homepage-example-pill-img" data-query="Sirocco" src="https://cards.scryfall.io/normal/front/c/e/ce37492e-4f07-4171-97d4-84f28fb4e2be.jpg?1782721401" alt="Sirocco" title="Click to search Sirocco" style="width: 150px !important; height: 210px !important; object-fit: contain; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--abyss-border); transition: transform 0.2s;">
          <img class="homepage-example-pill-img" data-query="Iizuka the Ruthless" src="https://cards.scryfall.io/normal/front/9/c/9ce461f7-385d-4379-83de-49571247c30d.jpg?1782718014" alt="Iizuka the Ruthless" title="Click to search Iizuka the Ruthless" style="width: 150px !important; height: 210px !important; object-fit: contain; border-radius: 6px; cursor: pointer; border: 1.5px solid var(--abyss-border); transition: transform 0.2s;">
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchForm = document.getElementById('search-form');
      const searchInput = document.getElementById('search-input');
      const pills = document.querySelectorAll('.homepage-example-pill-img');

      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          const query = pill.getAttribute('data-query');
          searchInput.value = query;
          searchForm.submit();
        });
      });
    });
  </script>
</body>
</html>
